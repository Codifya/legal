<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Privacy policies and terms of use for every Codifya app.">
<title>Codifya Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Literata:ital,opsz,wght@0,18..144,400;0,18..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F1EA;
    --bg-raised: #FFFFFF;
    --ink: #24211B;
    --ink-soft: #6B6558;
    --ink-faint: #A69E8C;
    --accent: #C2410C;
    --line: rgba(36, 33, 27, 0.10);
    --line-strong: rgba(36, 33, 27, 0.20);
    --shadow: rgba(36, 33, 27, 0.08);
    --font-display: "Manrope", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --font-body: "Literata", Georgia, "Times New Roman", serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16140F;
      --bg-raised: #1E1B15;
      --ink: #EFEAE0;
      --ink-soft: #B3AB98;
      --ink-faint: #6E6858;
      --accent: #F0793A;
      --line: rgba(239, 234, 224, 0.12);
      --line-strong: rgba(239, 234, 224, 0.22);
      --shadow: rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme="dark"] {
    --bg: #16140F;
    --bg-raised: #1E1B15;
    --ink: #EFEAE0;
    --ink-soft: #B3AB98;
    --ink-faint: #6E6858;
    --accent: #F0793A;
    --line: rgba(239, 234, 224, 0.12);
    --line-strong: rgba(239, 234, 224, 0.22);
    --shadow: rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: no-preference) {
    .reveal { animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 6rem;
  }

  header.masthead {
    margin-bottom: 3rem;
  }

  header.masthead h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.7rem;
    margin: 0 0 0.5rem;
    letter-spacing: -0.01em;
  }

  header.masthead p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1.02rem;
    max-width: 52ch;
  }

  .apps {
    display: grid;
    gap: 1rem;
  }

  .app-card {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 1.1rem 1.2rem;
    box-shadow: 0 1px 2px var(--shadow);
  }

  .app-card img {
    width: 56px;
    height: 56px;
    border-radius: 15px;
    box-shadow: 0 4px 12px var(--shadow), inset 0 0 0 1px var(--line-strong);
    flex-shrink: 0;
  }

  .app-card .app-info {
    flex: 1 1 auto;
    min-width: 0;
  }

  .app-card .app-info h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.12rem;
    margin: 0 0 0.2rem;
    letter-spacing: -0.005em;
  }

  .app-card .app-info p {
    margin: 0;
    font-size: 0.9rem;
    color: var(--ink-faint);
  }

  .app-card .app-links {
    display: flex;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .app-card .app-links a {
    display: inline-flex;
    align-items: center;
    font-family: var(--font-display);
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink);
    text-decoration: none;
    background: var(--bg);
    border: 1px solid var(--line-strong);
    padding: 0.5rem 0.85rem;
    border-radius: 100px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .app-card .app-links a:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .app-card .app-links a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  footer {
    margin-top: 3.5rem;
    padding-top: 2rem;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    color: var(--ink-faint);
  }

  footer a { color: var(--ink-soft); font-weight: 600; }

  @media (max-width: 480px) {
    .page { padding: 3rem 1.25rem 4rem; }
    .app-card { flex-wrap: wrap; }
    .app-card .app-links { width: 100%; }
    .app-card .app-links a { flex: 1 1 auto; justify-content: center; }
  }
</style>
</head>
